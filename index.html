<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#F2F4F6" />
<title>야간매출 계산기</title>
<style>
  :root {
    --blue: #3182F6;
    --blue-pressed: #1B64DA;
    --blue-bg: #E8F3FF;
    --grey900: #191F28;
    --grey700: #4E5968;
    --grey600: #6B7684;
    --grey500: #8B95A1;
    --grey400: #B0B8C1;
    --grey300: #D1D6DB;
    --grey200: #E5E8EB;
    --grey100: #F2F4F6;
    --red: #F04452;
    --red-bg: #FFF0F0;
    --radius: 20px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--grey100);
    color: var(--grey900);
    font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 32px);
  }

  .app {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding-top: 32px;
  }

  /* ── 헤더 ───────────────────────────── */
  header h1 {
    margin: 0 0 6px;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.4px;
  }
  header p {
    margin: 0;
    font-size: 15px;
    color: var(--grey500);
    letter-spacing: -0.2px;
  }

  /* ── 카드 ───────────────────────────── */
  .card {
    background: #FFFFFF;
    border-radius: var(--radius);
    padding: 24px 20px;
  }

  /* ── 결과 ───────────────────────────── */
  .result {
    text-align: center;
    padding: 36px 20px 32px;
  }
  .result .label {
    font-size: 15px;
    font-weight: 600;
    color: var(--grey500);
    letter-spacing: -0.2px;
  }
  .result .amount {
    margin-top: 12px;
    font-size: 52px;
    line-height: 1.15;
    font-weight: 800;
    letter-spacing: -2px;
    color: var(--blue);
    white-space: nowrap;
    transition: color 0.15s ease;
  }
  .result .amount .unit {
    font-size: 0.54em;
    font-weight: 700;
    letter-spacing: -0.6px;
    margin-left: 4px;
  }
  .result .amount.is-negative { color: var(--red); }
  .result .amount.is-zero { color: var(--grey400); }
  .result .amount.pop { animation: pop 0.22s ease-out; }
  @keyframes pop {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.045); }
    100% { transform: scale(1); }
  }
  .result .caption {
    margin-top: 14px;
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    color: var(--grey500);
    background: var(--grey100);
    border-radius: 999px;
    padding: 7px 14px;
    letter-spacing: -0.2px;
  }
  .result .caption.warn { color: var(--red); background: var(--red-bg); }

  /* ── 입력 ───────────────────────────── */
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 18px;
  }
  .card-head h2 {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .badge {
    font-size: 12px;
    font-weight: 700;
    color: var(--blue);
    background: var(--blue-bg);
    border-radius: 999px;
    padding: 5px 10px;
    letter-spacing: -0.2px;
  }
  .badge.hidden { display: none; }

  .fields { display: flex; flex-direction: column; gap: 20px; }

  .field label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: var(--grey700);
    margin-bottom: 8px;
    letter-spacing: -0.2px;
  }
  .field-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
    min-height: 32px;
  }
  .field-head label { margin-bottom: 0; }
  .mini-group { display: flex; gap: 6px; }
  .mini {
    height: 32px;
    padding: 0 12px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.2px;
    background: var(--grey100);
    color: var(--grey600);
  }
  .mini:active { background: var(--grey200); }
  .mini.on { background: var(--blue-bg); color: var(--blue); }
  .mini.off { visibility: hidden; }   /* 자리는 유지해 흔들리지 않게 */
  .input-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--grey100);
    border: 1.5px solid transparent;
    border-radius: 14px;
    padding: 0 16px;
    height: 58px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .input-wrap:focus-within { border-color: var(--blue); background: #FFFFFF; }
  .input-wrap input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    font: inherit;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--grey900);
    text-align: right;
    padding: 0;
  }
  .input-wrap input::placeholder { color: var(--grey400); font-weight: 600; }
  .input-wrap .won {
    font-size: 17px;
    font-weight: 700;
    color: var(--grey500);
    flex-shrink: 0;
  }
  .input-wrap.date input {
    text-align: left;
    font-size: 18px;
    min-height: 24px;
  }
  .input-wrap.date input::-webkit-date-and-time-value { text-align: left; }

  /* ── 요약 ───────────────────────────── */
  .summary {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--grey200);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .summary .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 14px;
    letter-spacing: -0.2px;
  }
  .summary .row .k { color: var(--grey500); font-weight: 500; }
  .summary .row .v { color: var(--grey700); font-weight: 600; }
  .summary .row.total .k { color: var(--grey900); font-weight: 700; }
  .summary .row.total .v { color: var(--blue); font-weight: 700; }

  /* ── 버튼 ───────────────────────────── */
  button {
    border: 0;
    font: inherit;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.08s ease, color 0.15s ease;
  }
  button:active { transform: scale(0.985); }

  .btn {
    width: 100%;
    height: 56px;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .btn-primary { background: var(--blue); color: #FFFFFF; }
  .btn-primary:active { background: var(--blue-pressed); }
  .btn-secondary { background: var(--blue-bg); color: var(--blue); }
  .btn-secondary:active { background: #D3E7FD; }
  .btn-quiet { background: var(--grey100); color: var(--grey600); }
  .btn-quiet:active { background: var(--grey200); }

  .btn-row { display: flex; gap: 10px; margin-top: 20px; }
  .btn-row .btn { flex: 1; }
  .btn-row .btn.narrow { flex: 0 0 34%; }

  /* ── 기록 목록 ───────────────────────── */
  .list-total {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    background: var(--grey100);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .list-total .k {
    font-size: 14px;
    font-weight: 600;
    color: var(--grey600);
    letter-spacing: -0.2px;
  }
  .list-total .v {
    font-size: 20px;
    font-weight: 800;
    color: var(--grey900);
    letter-spacing: -0.5px;
  }

  ul.records { list-style: none; margin: 0; padding: 0; }
  ul.records li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 0;
    border-top: 1px solid var(--grey200);
  }
  ul.records li:first-child { border-top: 0; }
  ul.records li.editing {
    background: var(--blue-bg);
    border-radius: 12px;
    padding: 16px 12px;
    margin: 4px 0;
    border-top-color: transparent;
  }
  .rec-main { flex: 1; min-width: 0; }
  .rec-date {
    font-size: 13px;
    font-weight: 600;
    color: var(--grey500);
    letter-spacing: -0.2px;
  }
  .rec-amount {
    margin-top: 3px;
    font-size: 20px;
    font-weight: 700;
    color: var(--grey900);
    letter-spacing: -0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rec-amount.neg { color: var(--red); }
  .rec-sub {
    margin-top: 3px;
    font-size: 12px;
    color: var(--grey500);
    letter-spacing: -0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rec-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .chip {
    height: 34px;
    padding: 0 12px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.2px;
    background: var(--grey100);
    color: var(--grey700);
  }
  .chip:active { background: var(--grey200); }
  .chip.danger { color: var(--red); background: var(--red-bg); }
  .chip.danger:active { background: #FFE0E0; }

  .empty {
    text-align: center;
    padding: 28px 0 8px;
    color: var(--grey400);
    font-size: 14px;
    letter-spacing: -0.2px;
  }

  /* ── 백업 ───────────────────────────── */
  .backup { display: flex; gap: 10px; }
  .backup .btn { height: 50px; font-size: 15px; }

  footer {
    text-align: center;
    font-size: 12px;
    color: var(--grey400);
    letter-spacing: -0.2px;
    line-height: 1.6;
  }

  /* ── 토스트 ─────────────────────────── */
  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translate(-50%, 12px);
    background: rgba(25, 31, 40, 0.92);
    color: #FFFFFF;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.2px;
    padding: 13px 20px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    max-width: calc(100% - 40px);
    text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>
</head>
<body>
  <main class="app">
    <header>
      <h1>야간매출 계산기</h1>
      <p>현재매출에서 주간매출을 빼서 계산하고 기록해요.</p>
    </header>

    <section class="card result">
      <div class="label">야간매출</div>
      <div class="amount is-zero" id="result">0<span class="unit">원</span></div>
      <div class="caption" id="caption">금액을 입력해 주세요</div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>매출 입력</h2>
        <span class="badge hidden" id="editBadge">수정 중</span>
      </div>

      <div class="fields">
        <div class="field">
          <div class="field-head">
            <label for="date">날짜</label>
            <div class="mini-group">
              <button class="mini" type="button" id="btnToday" data-date="today">오늘</button>
              <button class="mini" type="button" id="btnYesterday" data-date="yesterday">어제</button>
            </div>
          </div>
          <div class="input-wrap date">
            <input id="date" type="date" />
          </div>
        </div>

        <div class="field">
          <div class="field-head">
            <label for="current">현재매출</label>
            <button class="mini" type="button" id="clearCurrent" data-clear="current">다시</button>
          </div>
          <div class="input-wrap">
            <input id="current" type="tel" inputmode="numeric" pattern="[0-9]*"
                   autocomplete="off" enterkeyhint="done" placeholder="0"
                   aria-describedby="result" />
            <span class="won">원</span>
          </div>
        </div>

        <div class="field">
          <div class="field-head">
            <label for="weekly">주간매출</label>
            <button class="mini" type="button" id="clearWeekly" data-clear="weekly">다시</button>
          </div>
          <div class="input-wrap">
            <input id="weekly" type="tel" inputmode="numeric" pattern="[0-9]*"
                   autocomplete="off" enterkeyhint="done" placeholder="0"
                   aria-describedby="result" />
            <span class="won">원</span>
          </div>
        </div>
      </div>

      <div class="summary">
        <div class="row">
          <span class="k">현재매출</span>
          <span class="v" id="sumCurrent">0원</span>
        </div>
        <div class="row">
          <span class="k">주간매출</span>
          <span class="v" id="sumWeekly">- 0원</span>
        </div>
        <div class="row total">
          <span class="k">야간매출</span>
          <span class="v" id="sumResult">0원</span>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-quiet narrow" id="reset" type="button">다시 입력</button>
        <button class="btn btn-primary" id="save" type="button">저장하기</button>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>저장된 기록</h2>
        <span class="badge" id="countBadge">0건</span>
      </div>

      <div class="list-total">
        <span class="k">야간매출 합계</span>
        <span class="v" id="grandTotal">0원</span>
      </div>

      <ul class="records" id="records"></ul>
      <div class="empty" id="empty">아직 저장된 기록이 없어요</div>
    </section>

    <div class="backup">
      <button class="btn btn-secondary" id="export" type="button">JSON 내보내기</button>
      <button class="btn btn-quiet" id="importBtn" type="button">불러오기</button>
      <input type="file" id="importFile" accept="application/json,.json" class="visually-hidden" />
    </div>

    <footer>
      기록은 이 기기의 브라우저에만 JSON으로 저장돼요.<br />
      앱 삭제나 저장소 정리 시 사라지니 가끔 내보내 두세요.
    </footer>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'weekly-sales-calculator';
  var SCHEMA_VERSION = 2;   // v1: {night, current} 입력 → v2: {weekly, current} 입력
  var MAX_DIGITS = 12;                  // 입력 상한: 999,999,999,999원
  var FONT_STEPS = [52, 44, 36, 30];    // 자리수가 길어지면 단계적으로 축소
  var DAYS = ['일', '월', '화', '수', '목', '금', '토'];

  var els = {
    date:         document.getElementById('date'),
    weekly:       document.getElementById('weekly'),
    current:      document.getElementById('current'),
    clearCurrent: document.getElementById('clearCurrent'),
    clearWeekly:  document.getElementById('clearWeekly'),
    btnToday:     document.getElementById('btnToday'),
    btnYesterday: document.getElementById('btnYesterday'),
    result:     document.getElementById('result'),
    caption:    document.getElementById('caption'),
    sumWeekly:  document.getElementById('sumWeekly'),
    sumCurrent: document.getElementById('sumCurrent'),
    sumResult:  document.getElementById('sumResult'),
    reset:      document.getElementById('reset'),
    save:       document.getElementById('save'),
    editBadge:  document.getElementById('editBadge'),
    countBadge: document.getElementById('countBadge'),
    grandTotal: document.getElementById('grandTotal'),
    records:    document.getElementById('records'),
    empty:      document.getElementById('empty'),
    exportBtn:  document.getElementById('export'),
    importBtn:  document.getElementById('importBtn'),
    importFile: document.getElementById('importFile'),
    toast:      document.getElementById('toast')
  };

  var comma = new Intl.NumberFormat('ko-KR');

  /* 로컬 DB: { version, draft, records[] } — localStorage에 JSON으로 보관 */
  var db = { version: SCHEMA_VERSION, draft: null, records: [] };
  var editingId = null;

  /* ── 유틸 ───────────────────────────── */
  function dateStr(d) {
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  function todayStr() { return dateStr(new Date()); }

  function yesterdayStr() {
    var d = new Date();
    d.setDate(d.getDate() - 1);   // 월초·연초도 알아서 넘어간다
    return dateStr(d);
  }

  function prettyDate(iso) {
    var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    if (!p) return iso || '날짜 없음';
    // 문자열을 직접 쪼개 로컬 기준 날짜로 만든다 (UTC 파싱 시 요일이 밀림)
    var d = new Date(Number(p[1]), Number(p[2]) - 1, Number(p[3]));
    return p[1] + '. ' + Number(p[2]) + '. ' + Number(p[3]) + ' (' + DAYS[d.getDay()] + ')';
  }

  function digitsOf(str) {
    return String(str).replace(/[^0-9]/g, '').replace(/^0+(?=\d)/, '');
  }

  function valueOf(input) {
    var d = digitsOf(input.value).slice(0, MAX_DIGITS);
    return d ? Number(d) : 0;
  }

  function num(v) {
    var n = Number(v);
    return isFinite(n) && n >= 0 ? Math.floor(n) : 0;
  }

  function toast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () {
      els.toast.classList.remove('show');
    }, 1900);
  }

  /** 금액이 길어져도 카드 밖으로 넘치지 않도록 글자 크기를 맞춘다. */
  function fitResult() {
    var box = els.result.parentNode;
    var room = box.clientWidth - 40; // 좌우 여백
    for (var i = 0; i < FONT_STEPS.length; i++) {
      els.result.style.fontSize = FONT_STEPS[i] + 'px';
      if (els.result.scrollWidth <= room) break;
    }
  }

  /** 콤마를 다시 찍으면서 커서 위치를 (앞쪽 숫자 개수 기준으로) 유지한다. */
  function reformat(input) {
    var raw = input.value;
    var caret = input.selectionStart;
    var digitsBefore = raw.slice(0, caret).replace(/[^0-9]/g, '').length;

    var d = digitsOf(raw).slice(0, MAX_DIGITS);
    var next = d ? comma.format(Number(d)) : '';
    input.value = next;

    var pos = 0, seen = 0;
    while (pos < next.length && seen < digitsBefore) {
      if (/[0-9]/.test(next[pos])) seen++;
      pos++;
    }
    if (document.activeElement === input) {
      try { input.setSelectionRange(pos, pos); } catch (e) {}
    }
  }

  /* ── 저장소 (JSON) ──────────────────── */
  function persist() {
    db.version = SCHEMA_VERSION;
    db.draft = {
      date: els.date.value || todayStr(),
      weekly: valueOf(els.weekly),
      current: valueOf(els.current)
    };
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) {}
  }

  /** v1 기록({night, current})은 두 금액이 그대로 유지되도록 주간매출로 환산한다. */
  function weeklyOf(rec, current) {
    return (rec.weekly === undefined && rec.night !== undefined)
      ? num(current - num(rec.night))
      : num(rec.weekly);
  }

  function sanitize(rec) {
    if (!rec || typeof rec !== 'object') return null;
    var date = /^\d{4}-\d{2}-\d{2}$/.test(rec.date) ? rec.date : todayStr();
    var current = num(rec.current);
    return {
      id: String(rec.id || newId()),
      date: date,
      weekly: weeklyOf(rec, current),
      current: current,
      savedAt: rec.savedAt || new Date().toISOString()
    };
  }

  function load() {
    var saved;
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch (e) { saved = {}; }
    if (!saved || typeof saved !== 'object') saved = {};

    db.records = Array.isArray(saved.records)
      ? saved.records.map(sanitize).filter(Boolean)
      : [];

    // 구버전({night, current})도 입력값으로 이어받는다.
    var draft = saved.draft && typeof saved.draft === 'object' ? saved.draft : saved;
    var draftCurrent = num(draft.current);
    var draftWeekly = weeklyOf(draft, draftCurrent);
    els.date.value = /^\d{4}-\d{2}-\d{2}$/.test(draft.date) ? draft.date : todayStr();
    if (draftCurrent > 0) els.current.value = comma.format(draftCurrent);
    if (draftWeekly > 0) els.weekly.value = comma.format(draftWeekly);

    sortRecords();
  }

  function newId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return String(Date.now()) + '-' + Math.random().toString(36).slice(2, 8);
  }

  function sortRecords() {
    db.records.sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;   // 최신 날짜 먼저
      return (a.savedAt < b.savedAt) ? 1 : -1;
    });
  }

  /* ── 렌더 ───────────────────────────── */
  function renderResult() {
    var weekly = valueOf(els.weekly);
    var current = valueOf(els.current);
    var night = current - weekly;      // 야간매출 = 현재매출 − 주간매출

    els.result.innerHTML = comma.format(night) + '<span class="unit">원</span>';
    els.result.classList.toggle('is-negative', night < 0);
    els.result.classList.toggle('is-zero', night === 0);
    fitResult();

    els.sumCurrent.textContent = comma.format(current) + '원';
    els.sumWeekly.textContent = '- ' + comma.format(weekly) + '원';
    els.sumResult.textContent = comma.format(night) + '원';

    if (night < 0) {
      els.caption.textContent = '주간매출이 현재매출보다 커요';
      els.caption.classList.add('warn');
    } else {
      els.caption.classList.remove('warn');
      els.caption.textContent = (weekly === 0 && current === 0)
        ? '금액을 입력해 주세요'
        : comma.format(current) + ' − ' + comma.format(weekly);
    }
  }

  function renderList() {
    els.records.innerHTML = '';

    var total = 0;
    db.records.forEach(function (r) {
      total += r.current - r.weekly;

      var li = document.createElement('li');
      if (r.id === editingId) li.className = 'editing';

      var night = r.current - r.weekly;
      var main = document.createElement('div');
      main.className = 'rec-main';

      var date = document.createElement('div');
      date.className = 'rec-date';
      date.textContent = prettyDate(r.date);

      var amount = document.createElement('div');
      amount.className = 'rec-amount' + (night < 0 ? ' neg' : '');
      amount.textContent = comma.format(night) + '원';

      var sub = document.createElement('div');
      sub.className = 'rec-sub';
      sub.textContent = '현재 ' + comma.format(r.current) + ' − 주간 ' + comma.format(r.weekly);

      main.appendChild(date);
      main.appendChild(amount);
      main.appendChild(sub);

      var actions = document.createElement('div');
      actions.className = 'rec-actions';
      actions.appendChild(chipButton('수정', 'edit', r.id));
      actions.appendChild(chipButton('삭제', 'delete', r.id, true));

      li.appendChild(main);
      li.appendChild(actions);
      els.records.appendChild(li);
    });

    els.countBadge.textContent = db.records.length + '건';
    els.grandTotal.textContent = comma.format(total) + '원';
    els.empty.style.display = db.records.length ? 'none' : 'block';
  }

  function chipButton(label, act, id, danger) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (danger ? ' danger' : '');
    b.textContent = label;
    b.dataset.act = act;
    b.dataset.id = id;
    return b;
  }

  function renderMode() {
    var editing = editingId !== null;
    els.editBadge.classList.toggle('hidden', !editing);
    els.save.textContent = editing ? '수정 완료' : '저장하기';
    els.reset.textContent = editing ? '취소' : '다시 입력';
  }

  /** 입력칸별 '다시'는 값이 있을 때만 보이고, 날짜 칩은 선택 상태를 표시한다. */
  function renderChips() {
    els.clearCurrent.classList.toggle('off', els.current.value === '');
    els.clearWeekly.classList.toggle('off', els.weekly.value === '');
    els.btnToday.classList.toggle('on', els.date.value === todayStr());
    els.btnYesterday.classList.toggle('on', els.date.value === yesterdayStr());
  }

  function renderAll() {
    renderResult();
    renderChips();
    renderList();
    renderMode();
  }

  function pop() {
    els.result.classList.remove('pop');
    void els.result.offsetWidth; // reflow로 애니메이션 재시작
    els.result.classList.add('pop');
  }

  /* ── CRUD ───────────────────────────── */
  function clearInputs() {
    els.weekly.value = '';
    els.current.value = '';
    els.date.value = todayStr();
  }

  function saveRecord() {
    var weekly = valueOf(els.weekly);
    var current = valueOf(els.current);

    if (weekly === 0 && current === 0) {
      toast('금액을 먼저 입력해 주세요');
      els.current.focus();
      return;   // 두 칸 모두 0이면 저장하지 않는다
    }

    var date = els.date.value || todayStr();

    if (editingId !== null) {
      var target = db.records.filter(function (r) { return r.id === editingId; })[0];
      if (target) {
        target.date = date;
        target.weekly = weekly;
        target.current = current;
        target.savedAt = new Date().toISOString();
      }
      editingId = null;
      toast('기록을 수정했어요');
    } else {
      db.records.push({
        id: newId(),
        date: date,
        weekly: weekly,
        current: current,
        savedAt: new Date().toISOString()
      });
      toast('기록을 저장했어요');
    }

    sortRecords();
    clearInputs();
    persist();
    renderAll();
    pop();
  }

  function startEdit(id) {
    var r = db.records.filter(function (x) { return x.id === id; })[0];
    if (!r) return;

    editingId = id;
    els.date.value = r.date;
    els.weekly.value = r.weekly ? comma.format(r.weekly) : '';
    els.current.value = r.current ? comma.format(r.current) : '';

    persist();
    renderAll();
    pop();
    els.save.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  function cancelEdit() {
    editingId = null;
    clearInputs();
    persist();
    renderAll();
  }

  function removeRecord(id) {
    var r = db.records.filter(function (x) { return x.id === id; })[0];
    if (!r) return;
    if (!window.confirm(prettyDate(r.date) + ' 기록을 삭제할까요?')) return;

    db.records = db.records.filter(function (x) { return x.id !== id; });
    if (editingId === id) {
      editingId = null;
      clearInputs();
    }
    persist();
    renderAll();
    toast('기록을 삭제했어요');
  }

  /* ── 내보내기 / 불러오기 ─────────────── */
  function exportJson() {
    if (!db.records.length) {
      toast('내보낼 기록이 없어요');
      return;
    }
    var payload = {
      version: SCHEMA_VERSION,
      exportedAt: new Date().toISOString(),
      records: db.records
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'sales-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast('JSON 파일로 내보냈어요');
  }

  function importJson(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try { parsed = JSON.parse(reader.result); } catch (e) {
        toast('JSON 파일을 읽을 수 없어요');
        return;
      }
      var incoming = Array.isArray(parsed) ? parsed
                   : (parsed && Array.isArray(parsed.records) ? parsed.records : null);
      if (!incoming) {
        toast('기록이 들어있지 않은 파일이에요');
        return;
      }
      var clean = incoming.map(sanitize).filter(Boolean);
      if (!clean.length) {
        toast('불러올 기록이 없어요');
        return;
      }
      if (db.records.length &&
          !window.confirm('현재 기록 ' + db.records.length + '건을 불러온 ' + clean.length + '건으로 교체할까요?')) {
        return;
      }
      db.records = clean;
      editingId = null;
      sortRecords();
      persist();
      renderAll();
      toast(clean.length + '건을 불러왔어요');
    };
    reader.onerror = function () { toast('파일을 읽지 못했어요'); };
    reader.readAsText(file);
  }

  /* ── 이벤트 ─────────────────────────── */
  [els.current, els.weekly].forEach(function (input) {
    input.addEventListener('input', function () {
      reformat(input);
      renderResult();
      renderChips();
      persist();
      pop();
    });
    input.addEventListener('focus', function () {
      setTimeout(function () {
        input.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }, 250);
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') input.blur();
    });
  });

  els.date.addEventListener('change', function () {
    renderChips();
    persist();
  });

  // 입력칸별 '다시' — 해당 칸만 비운다
  [els.clearCurrent, els.clearWeekly].forEach(function (btn) {
    btn.addEventListener('click', function () {
      var input = els[btn.dataset.clear];
      input.value = '';
      renderResult();
      renderChips();
      persist();
      pop();
      input.focus();
    });
  });

  // 날짜 빠른 선택
  [els.btnToday, els.btnYesterday].forEach(function (btn) {
    btn.addEventListener('click', function () {
      els.date.value = btn.dataset.date === 'today' ? todayStr() : yesterdayStr();
      renderChips();
      persist();
    });
  });

  els.save.addEventListener('click', saveRecord);

  els.reset.addEventListener('click', function () {
    if (editingId !== null) {
      cancelEdit();
      toast('수정을 취소했어요');
      return;
    }
    clearInputs();
    persist();
    renderAll();
    pop();
    els.current.focus();
  });

  els.records.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('button[data-act]') : null;
    if (!btn) return;
    if (btn.dataset.act === 'edit') startEdit(btn.dataset.id);
    else if (btn.dataset.act === 'delete') removeRecord(btn.dataset.id);
  });

  els.exportBtn.addEventListener('click', exportJson);
  els.importBtn.addEventListener('click', function () { els.importFile.click(); });
  els.importFile.addEventListener('change', function () {
    if (this.files && this.files[0]) importJson(this.files[0]);
    this.value = ''; // 같은 파일을 다시 골라도 change가 걸리도록
  });

  window.addEventListener('resize', fitResult);

  load();
  persist();     // 구버전 데이터를 읽었다면 새 형식으로 즉시 다시 써 둔다
  renderAll();
})();
</script>
</body>
</html>
